plugins { id 'com.android.application' }
android {
 namespace 'com.prismgd.dynamicdash'
 compileSdk 35
 ndkVersion '21.4.7075529'
 defaultConfig {
  applicationId 'com.prismgd.dynamicdash'
  minSdk 23
  targetSdk 28
  versionCode 1
  versionName '1.0.0-alpha.1'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake {
   targets 'MyGame'
   arguments '-DDYNAMIC_DASH_BUILD_COCOS=ON','-DBUILD_TESTING=OFF','-DANDROID_STL=c++_static'
   cppFlags '-frtti -fexceptions -fsigned-char'
  } }
 }
 externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1' } }
 buildTypes { debug { debuggable true; jniDebuggable true }; release { minifyEnabled false } }
}
dependencies { implementation project(':libcocos2dx') }